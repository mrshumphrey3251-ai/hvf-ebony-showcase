<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humphrey Dynamics - Sovereign Orbit Crest</title>
    <style>
        /* =========================================
           CEO COLOR CONTROL CENTER (SUPERNOVA)
           ========================================= */
        :root {
            --brand-primary: #FFDF00;    
            --brand-glow: rgba(255, 223, 0, 1);
            --brand-shadow: #b38f00;     
            --bg-center: #110d00;        
            --bg-edge: #000000;          
            --text-color: #ffffff;       
        }

        body { 
            background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-edge) 100%); 
            overflow: hidden; display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; perspective: 1200px; font-family: monospace;
        }
        
        .matrix-world { 
            position: relative; transform-style: preserve-3d; 
            animation: worldSpin 15s cubic-bezier(0.4, 0.0, 0.2, 1) infinite; 
        }
        
        /* The Central Core */
        .core { position: absolute; top: -150px; left: -100px; width: 200px; height: 300px; transform-style: preserve-3d; }
        
        /* Phase 1: The Core Energy Line */
        .vertical-line { 
            position: absolute; left: 90px; top: -20px; width: 15px; height: 340px; 
            background: var(--brand-primary); 
            box-shadow: 0 0 50px var(--brand-primary), 0 0 100px var(--brand-glow), 0 0 150px #ffffff; 
            animation: morphLine 15s infinite; 
        }
        
        /* Phase 3: The Forged Old English H Crest */
        .h-crest { 
            font-family: "Old English Text MT", "UnifrakturMaguntia", "Blackletter", serif; 
            font-size: 360px; position: absolute; top: -75px; left: -40px; width: 280px; height: 400px;
            color: var(--brand-primary); 
            text-align: center;
            text-shadow: 
                1px 1px 0 var(--brand-shadow), 3px 3px 0 var(--brand-shadow), 5px 5px 0 var(--brand-shadow), 
                15px 15px 20px #000000, 0 0 80px var(--brand-glow), 0 0 120px var(--brand-glow); 
            opacity: 0; 
            clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); 
            animation: buildH 15s infinite; 
            transform-style: preserve-3d;
        }

        /* The Embedded Corporate Name - MOVED TO BASE */
        .h-text {
            position: absolute; bottom: -60px; left: 50%;
            transform: translateX(-50%) translateZ(40px);
            font-family: "Arial", sans-serif; font-size: 18px; font-weight: bold;
            letter-spacing: 8px; color: var(--text-color);
            text-shadow: 0 0 10px var(--text-color), 0 0 20px var(--brand-primary);
            background: rgba(0, 0, 0, 0.85); padding: 10px 15px 10px 23px;
            border-top: 2px solid var(--brand-primary); border-bottom: 2px solid var(--brand-primary);
            white-space: nowrap; box-shadow: 0 0 40px rgba(0,0,0,1);
        }
        
        /* Orbiting Word Rings */
        .word-orbit { position: absolute; top: 150px; left: 100px; transform-style: preserve-3d; }
        .ring1 { animation: spinRing1 15s infinite cubic-bezier(0.5, 0, 0.5, 1); }
        .ring2 { animation: spinRing2 15s infinite cubic-bezier(0.5, 0, 0.5, 1); }
        .ring3 { animation: spinRing3 15s infinite cubic-bezier(0.5, 0, 0.5, 1); }

        .floating-word {
            position: absolute; font-family: "Arial", sans-serif; font-size: 22px; font-weight: bold;
            color: var(--brand-primary); text-shadow: 0 0 20px var(--brand-glow), 0 0 40px #ffffff;
            white-space: nowrap; letter-spacing: 4px;
            animation: absorbWord 15s infinite;
        }

        /* Animations */
        @keyframes worldSpin { 
            0% { transform: rotateY(0deg) rotateX(5deg); } 
            25% { transform: rotateY(45deg) rotateX(5deg); } 
            55% { transform: rotateY(1080deg) rotateX(10deg); } 
            85%, 100% { transform: rotateY(1440deg) rotateX(5deg); } 
        }
        @keyframes spinRing1 { 0% { transform: rotateY(0deg) rotateX(15deg); } 45%, 100% { transform: rotateY(1440deg) rotateX(15deg); } }
        @keyframes spinRing2 { 0% { transform: rotateX(0deg) rotateY(45deg); } 45%, 100% { transform: rotateX(1440deg) rotateY(45deg); } }
        @keyframes spinRing3 { 0% { transform: rotateZ(0deg) rotateX(-30deg) rotateY(45deg); } 45%, 100% { transform: rotateZ(1440deg) rotateX(-30deg) rotateY(45deg); } }

        @keyframes absorbWord {
            0%, 35% { opacity: 1; transform: translate(-50%, -50%) translateZ(400px); }
            45%, 100% { opacity: 0; transform: translate(-50%, -50%) translateZ(0px) scale(0); }
        }

        @keyframes morphLine {
            0%, 35% { opacity: 1; transform: scaleX(1); filter: blur(0px); }
            45%, 100% { opacity: 0; transform: scaleX(12); filter: blur(40px); }
        }
        @keyframes buildH {
            0%, 35% { opacity: 0; clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
            45% { opacity: 1; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
            100% { opacity: 1; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        }
    </style>
</head>
<body>
    <div class="matrix-world">
        <!-- The Orbital Rings -->
        <div class="word-orbit ring1"><div class="floating-word">HUMPHREY DYNAMICS</div></div>
        <div class="word-orbit ring2"><div class="floating-word">HUMPHREY DYNAMICS</div></div>
        <div class="word-orbit ring3"><div class="floating-word">HUMPHREY DYNAMICS</div></div>

        <!-- The Central Core -->
        <div class="core">
            <div class="vertical-line"></div>
            <div class="h-crest">
                H
                <div class="h-text">HUMPHREY DYNAMICS</div>
            </div>
        </div>
    </div>
</body>
</html>
