<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humphrey Dynamics - Total Assembly Crest</title>
    <style>
        /* =========================================
           CEO COLOR CONTROL CENTER (SUPERNOVA)
           ========================================= */
        :root {
            --brand-primary: #FFDF00;    
            --brand-glow: rgba(255, 223, 0, 1);
            --brand-shadow: #b38f00;     
            --bg-center: #110d00;        
            --bg-edge: #000000;          
            --text-color: #ffffff;       
        }

        body { 
            background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-edge) 100%); 
            overflow: hidden; display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; perspective: 1200px; font-family: monospace;
        }
        
        .scene-tilt { 
            transform: rotateX(15deg); 
            transform-style: preserve-3d; 
        }

        .matrix-world { 
            position: relative; transform-style: preserve-3d; 
            /* Continuous clockwise spin */
            animation: worldSpin 15s linear infinite; 
        }
        
        /* The Mechanical Core Frame */
        .h-core { position: relative; width: 140px; height: 240px; transform-style: preserve-3d; }
        
        /* All Blocks start invisible and fly in */
        .block {
            position: absolute;
            background: var(--brand-primary);
            border-radius: 6px;
            box-shadow: 0 0 25px var(--brand-glow), inset 0 0 15px #ffffff;
            border: 2px solid var(--brand-shadow);
            transform-style: preserve-3d;
            opacity: 0;
            width: 40px; height: 55px;
        }
        
        /* Crossbeam Fragments */
        .fragment {
            position: absolute; width: 26px; height: 25px;
            background: var(--brand-primary); border-radius: 6px;
            box-shadow: 0 0 30px var(--brand-glow), inset 0 0 15px #ffffff, 0 0 50px #ffffff;
            border: 2px solid var(--brand-shadow);
            transform-style: preserve-3d;
            opacity: 0;
        }

        /* The Embedded Corporate Name - Anchor Plate */
        .h-text {
            position: absolute; bottom: -80px; left: 50%;
            transform: translateX(-50%) translateZ(30px);
            font-family: "Arial", sans-serif; font-size: 18px; font-weight: bold;
            letter-spacing: 8px; color: var(--text-color);
            text-shadow: 0 0 10px var(--text-color), 0 0 20px var(--brand-primary);
            background: rgba(0, 0, 0, 0.85); padding: 10px 15px 10px 23px;
            border-top: 2px solid var(--brand-primary); border-bottom: 2px solid var(--brand-primary);
            white-space: nowrap; box-shadow: 0 0 40px rgba(0,0,0,1);
            /* Name sits there from the beginning */
            animation: pulseBase 15s infinite;
        }

        /* ====================================================
           THE TOTAL ASSEMBLY TIMELINE 
           (Base plate is visible at 0%. Pillars build from bottom up.)
           ==================================================== */
           
        /* Left Pillar (Bottom to Top) */
        .l-block4 { animation: slamL4 15s infinite; }
        .l-block3 { animation: slamL3 15s infinite; }
        .l-block2 { animation: slamL2 15s infinite; }
        .l-block1 { animation: slamL1 15s infinite; }

        /* Right Pillar (Bottom to Top) */
        .r-block4 { animation: slamR4 15s infinite; }
        .r-block3 { animation: slamR3 15s infinite; }
        .r-block2 { animation: slamR2 15s infinite; }
        .r-block1 { animation: slamR1 15s infinite; }

        /* Crossbeam Fragments */
        .f1 { animation: slamF1 15s infinite; }
        .f2 { animation: slamF2 15s infinite; }
        .f3 { animation: slamF3 15s infinite; }
        .f4 { animation: slamF4 15s infinite; }

        /* Pillar Animations */
        /* Left Foundation */
        @keyframes slamL4 { 0%, 5% { transform: translate3d(-500px, 500px, 300px) rotateY(180deg); opacity: 0; } 10%, 90% { transform: translate3d(0, 180px, 0) rotateY(0deg); opacity: 1; } 95%, 100% { transform: translate3d(-500px, 500px, 300px); opacity: 0; } }
        @keyframes slamL3 { 0%, 9% { transform: translate3d(-500px, 300px, 200px) rotateX(180deg); opacity: 0; } 14%, 90% { transform: translate3d(0, 120px, 0) rotateX(0deg); opacity: 1; } 95%, 100% { transform: translate3d(-500px, 300px, 200px); opacity: 0; } }
        @keyframes slamL2 { 0%, 13% { transform: translate3d(-500px, 100px, -200px) rotateZ(180deg); opacity: 0; } 18%, 90% { transform: translate3d(0, 60px, 0) rotateZ(0deg); opacity: 1; } 95%, 100% { transform: translate3d(-500px, 100px, -200px); opacity: 0; } }
        @keyframes slamL1 { 0%, 17% { transform: translate3d(-500px, -200px, -300px) rotateY(-180deg); opacity: 0; } 22%, 90% { transform: translate3d(0, 0px, 0) rotateY(0deg); opacity: 1; } 95%, 100% { transform: translate3d(-500px, -200px, -300px); opacity: 0; } }

        /* Right Foundation */
        @keyframes slamR4 { 0%, 5% { transform: translate3d(500px, 500px, -300px) rotateY(-180deg); opacity: 0; } 10%, 90% { transform: translate3d(100px, 180px, 0) rotateY(0deg); opacity: 1; } 95%, 100% { transform: translate3d(500px, 500px, -300px); opacity: 0; } }
        @keyframes slamR3 { 0%, 9% { transform: translate3d(500px, 300px, -200px) rotateX(-180deg); opacity: 0; } 14%, 90% { transform: translate3d(100px, 120px, 0) rotateX(0deg); opacity: 1; } 95%, 100% { transform: translate3d(500px, 300px, -200px); opacity: 0; } }
        @keyframes slamR2 { 0%, 13% { transform: translate3d(500px, 100px, 200px) rotateZ(-180deg); opacity: 0; } 18%, 90% { transform: translate3d(100px, 60px, 0) rotateZ(0deg); opacity: 1; } 95%, 100% { transform: translate3d(500px, 100px, 200px); opacity: 0; } }
        @keyframes slamR1 { 0%, 17% { transform: translate3d(500px, -200px, 300px) rotateY(180deg); opacity: 0; } 22%, 90% { transform: translate3d(100px, 0px, 0) rotateY(0deg); opacity: 1; } 95%, 100% { transform: translate3d(500px, -200px, 300px); opacity: 0; } }

        /* Crossbeam Fragments lock in after pillars are built */
        @keyframes slamF1 { 0%, 25% { transform: translate3d(-200px, -200px, 300px) rotateY(360deg); opacity: 0; } 30%, 90% { transform: translate3d(43px, 90px, 0px) rotateY(0deg); opacity: 1; } 95%, 100% { transform: translate3d(-200px, -200px, 300px); opacity: 0; } }
        @keyframes slamF2 { 0%, 28% { transform: translate3d(200px, 300px, -300px) rotateX(360deg); opacity: 0; } 33%, 90% { transform: translate3d(71px, 120px, 0px) rotateX(0deg); opacity: 1; } 95%, 100% { transform: translate3d(200px, 300px, -300px); opacity: 0; } }
        @keyframes slamF3 { 0%, 31% { transform: translate3d(-200px, 300px, -300px) rotateZ(360deg); opacity: 0; } 36%, 90% { transform: translate3d(43px, 120px, 0px) rotateZ(0deg); opacity: 1; } 95%, 100% { transform: translate3d(-200px, 300px, -300px); opacity: 0; } }
        @keyframes slamF4 { 0%, 34% { transform: translate3d(200px, -200px, 300px) rotateY(-360deg); opacity: 0; } 39%, 90% { transform: translate3d(71px, 90px, 0px) rotateY(0deg); opacity: 1; } 95%, 100% { transform: translate3d(200px, -200px, 300px); opacity: 0; } }

        @keyframes worldSpin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        @keyframes pulseBase { 0%, 100% { opacity: 0.8; box-shadow: 0 0 30px rgba(0,0,0,1); } 50% { opacity: 1; box-shadow: 0 0 50px rgba(255,223,0,0.5); } }
    </style>
</head>
<body>
    <div class="scene-tilt">
        <div class="matrix-world">
            <div class="h-core">
                <!-- Baseplate Label sits from second zero -->
                <div class="h-text">HUMPHREY DYNAMICS</div>

                <!-- Left Pillar (Bottom to Top) -->
                <div class="block l-block4"></div>
                <div class="block l-block3"></div>
                <div class="block l-block2"></div>
                <div class="block l-block1"></div>
                
                <!-- Right Pillar (Bottom to Top) -->
                <div class="block r-block4"></div>
                <div class="block r-block3"></div>
                <div class="block r-block2"></div>
                <div class="block r-block1"></div>
                
                <!-- Crossbeam Fragments -->
                <div class="fragment f1"></div>
                <div class="fragment f2"></div>
                <div class="fragment f3"></div>
                <div class="fragment f4"></div>
            </div>
        </div>
    </div>
</body>
</html>
