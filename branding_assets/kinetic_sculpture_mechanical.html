<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humphrey Dynamics - Mechanical Sovereign Crest</title>
    <style>
        /* =========================================
           CEO COLOR CONTROL CENTER (SUPERNOVA)
           ========================================= */
        :root {
            --brand-primary: #FFDF00;    
            --brand-glow: rgba(255, 223, 0, 1);
            --brand-shadow: #b38f00;     
            --bg-center: #110d00;        
            --bg-edge: #000000;          
            --text-color: #ffffff;       
        }

        body { 
            background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-edge) 100%); 
            overflow: hidden; display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; perspective: 1200px; font-family: monospace;
        }
        
        .scene-tilt { 
            transform: rotateX(15deg); 
            transform-style: preserve-3d; 
        }

        .matrix-world { 
            position: relative; transform-style: preserve-3d; 
            animation: worldSpin 15s linear infinite; 
        }
        
        /* The Mechanical Core */
        .h-core { position: relative; width: 140px; height: 240px; transform-style: preserve-3d; }
        
        /* Stacked, slightly rounded blocks */
        .block {
            position: absolute;
            background: var(--brand-primary);
            border-radius: 6px;
            box-shadow: 0 0 25px var(--brand-glow), inset 0 0 15px #ffffff;
            border: 2px solid var(--brand-shadow);
            transform-style: preserve-3d;
        }
        
        /* Left Pillar (4 stacked blocks) */
        .l-block1 { top: 0; left: 0; width: 40px; height: 55px; }
        .l-block2 { top: 60px; left: 0; width: 40px; height: 55px; }
        .l-block3 { top: 120px; left: 0; width: 40px; height: 55px; }
        .l-block4 { top: 180px; left: 0; width: 40px; height: 55px; }
        
        /* Right Pillar (4 stacked blocks) */
        .r-block1 { top: 0; right: 0; width: 40px; height: 55px; }
        .r-block2 { top: 60px; right: 0; width: 40px; height: 55px; }
        .r-block3 { top: 120px; right: 0; width: 40px; height: 55px; }
        .r-block4 { top: 180px; right: 0; width: 40px; height: 55px; }

        /* Floating Gear Fragments that forge the Crossbeam */
        .fragment {
            position: absolute; width: 26px; height: 25px;
            background: var(--brand-primary); border-radius: 6px;
            box-shadow: 0 0 30px var(--brand-glow), inset 0 0 15px #ffffff, 0 0 50px #ffffff;
            border: 2px solid var(--brand-shadow);
            transform-style: preserve-3d;
        }

        /* Fragments orbit and snap into the center space to lock the H */
        .f1 { animation: snap1 6s infinite ease-in; }
        .f2 { animation: snap2 6s infinite ease-in 1.5s; }
        .f3 { animation: snap3 6s infinite ease-in 3.0s; }
        .f4 { animation: snap4 6s infinite ease-in 4.5s; }

        @keyframes snap1 {
            0% { transform: translate3d(-300px, -200px, 300px) rotateY(360deg); opacity: 0; }
            5% { opacity: 1; }
            20%, 100% { transform: translate3d(43px, 90px, 0px) rotateY(0deg); opacity: 1; }
        }
        @keyframes snap2 {
            0% { transform: translate3d(300px, 200px, -300px) rotateX(360deg); opacity: 0; }
            5% { opacity: 1; }
            20%, 100% { transform: translate3d(71px, 120px, 0px) rotateX(0deg); opacity: 1; }
        }
        @keyframes snap3 {
            0% { transform: translate3d(-300px, 200px, -300px) rotateZ(360deg); opacity: 0; }
            5% { opacity: 1; }
            20%, 100% { transform: translate3d(43px, 120px, 0px) rotateZ(0deg); opacity: 1; }
        }
        @keyframes snap4 {
            0% { transform: translate3d(300px, -200px, 300px) rotateY(-360deg); opacity: 0; }
            5% { opacity: 1; }
            20%, 100% { transform: translate3d(71px, 90px, 0px) rotateY(0deg); opacity: 1; }
        }

        /* The Embedded Corporate Name - Floating Base-Plate */
        .h-text {
            position: absolute; bottom: -80px; left: 50%;
            transform: translateX(-50%) translateZ(30px);
            font-family: "Arial", sans-serif; font-size: 18px; font-weight: bold;
            letter-spacing: 8px; color: var(--text-color);
            text-shadow: 0 0 10px var(--text-color), 0 0 20px var(--brand-primary);
            background: rgba(0, 0, 0, 0.85); padding: 10px 15px 10px 23px;
            border-top: 2px solid var(--brand-primary); border-bottom: 2px solid var(--brand-primary);
            white-space: nowrap; box-shadow: 0 0 40px rgba(0,0,0,1);
        }

        /* Continuous clockwise spin */
        @keyframes worldSpin { 
            0% { transform: rotateY(0deg); } 
            100% { transform: rotateY(360deg); } 
        }
    </style>
</head>
<body>
    <div class="scene-tilt">
        <div class="matrix-world">
            <div class="h-core">
                <!-- Left Pillar -->
                <div class="block l-block1"></div>
                <div class="block l-block2"></div>
                <div class="block l-block3"></div>
                <div class="block l-block4"></div>
                
                <!-- Right Pillar -->
                <div class="block r-block1"></div>
                <div class="block r-block2"></div>
                <div class="block r-block3"></div>
                <div class="block r-block4"></div>
                
                <!-- Orbiting Fragments that snap into the Crossbeam -->
                <div class="fragment f1"></div>
                <div class="fragment f2"></div>
                <div class="fragment f3"></div>
                <div class="fragment f4"></div>
                
                <!-- Baseplate Label -->
                <div class="h-text">HUMPHREY DYNAMICS</div>
            </div>
        </div>
    </div>
</body>
</html>
