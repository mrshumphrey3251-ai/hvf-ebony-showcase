<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humphrey Dynamics - True 3D Heavy Iron</title>
    <style>
        /* =========================================
           CEO COLOR CONTROL CENTER 
           Defaulted to Original Matrix Cyan. Change hex to alter.
           ========================================= */
        :root {
            --brand-primary: #00ffcc;    
            --brand-glow: rgba(0, 255, 204, 0.8);
            --brand-shadow: #004433;     
            --bg-center: #00110a;        
            --bg-edge: #000000;          
            --text-color: #ffffff;       
        }

        body { 
            background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-edge) 100%); 
            overflow: hidden; display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; perspective: 1200px; font-family: monospace;
        }
        
        .scene-tilt { 
            transform: rotateX(15deg) rotateY(-15deg); 
            transform-style: preserve-3d; 
        }

        .matrix-world { 
            position: relative; transform-style: preserve-3d; 
            animation: worldSpin 20s linear infinite; 
        }
        
        /* The Core Frame */
        .h-core { position: relative; width: 160px; height: 160px; transform-style: preserve-3d; }
        
        /* =========================================
           TRUE 3D CUBE ARCHITECTURE
           ========================================= */
        .cube { 
            position: absolute; width: 40px; height: 40px; 
            transform-style: preserve-3d; opacity: 0; 
        }
        
        /* Physical faces of the 3D block */
        .face {
            position: absolute; width: 40px; height: 40px;
            background: rgba(0, 255, 204, 0.15); /* Tinted transparent iron */
            border: 2px solid var(--brand-primary);
            box-shadow: inset 0 0 15px var(--brand-glow);
            backface-visibility: visible;
        }
        
        /* Darken back and bottom planes for 3D depth illusion */
        .face.back, .face.bottom, .face.left { background: rgba(0, 150, 150, 0.3); }

        /* Mathematical 3D Axis Alignment */
        .front  { transform: translateZ(20px); }
        .back   { transform: rotateY(180deg) translateZ(20px); }
        .right  { transform: rotateY(90deg) translateZ(20px); }
        .left   { transform: rotateY(-90deg) translateZ(20px); }
        .top    { transform: rotateX(90deg) translateZ(20px); }
        .bottom { transform: rotateX(-90deg) translateZ(20px); }

        /* =========================================
           BLOCK PLACEMENT (4x4 Grid)
           ========================================= */
        /* Left Pillar */
        .l-block4 { top: 120px; left: 0; animation: slamRow4 15s infinite; }
        .l-block3 { top: 80px; left: 0; animation: slamRow3 15s infinite; }
        .l-block2 { top: 40px; left: 0; animation: slamRow2 15s infinite; }
        .l-block1 { top: 0px; left: 0; animation: slamRow1 15s infinite; }
        
        /* Right Pillar */
        .r-block4 { top: 120px; left: 120px; animation: slamRow4 15s infinite; }
        .r-block3 { top: 80px; left: 120px; animation: slamRow3 15s infinite; }
        .r-block2 { top: 40px; left: 120px; animation: slamRow2 15s infinite; }
        .r-block1 { top: 0px; left: 120px; animation: slamRow1 15s infinite; }
        
        /* Crossbeam (Center 2x2 blocks) */
        .f1 { top: 40px; left: 40px; animation: slamFX 15s infinite; }
        .f2 { top: 40px; left: 80px; animation: slamFY 15s infinite; }
        .f3 { top: 80px; left: 40px; animation: slamFZ 15s infinite; }
        .f4 { top: 80px; left: 80px; animation: slamFNX 15s infinite; }

        /* =========================================
           CORPORATE ANCHOR PLATE
           ========================================= */
        .h-text {
            position: absolute; bottom: -80px; left: 50%;
            transform: translateX(-50%) translateZ(40px);
            font-family: "Arial", sans-serif; font-size: 16px; font-weight: bold;
            letter-spacing: 8px; color: var(--text-color);
            text-shadow: 0 0 10px var(--text-color), 0 0 20px var(--brand-primary);
            background: rgba(0, 0, 0, 0.85); padding: 10px 15px 10px 23px;
            border-top: 2px solid var(--brand-primary); border-bottom: 2px solid var(--brand-primary);
            white-space: nowrap; box-shadow: 0 0 40px rgba(0,0,0,1);
            animation: pulseBase 15s infinite;
        }

        /* =========================================
           TIMELINE ANIMATIONS
           ========================================= */
        @keyframes worldSpin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        @keyframes pulseBase { 0%, 100% { opacity: 0.8; box-shadow: 0 0 30px rgba(0,0,0,1); } 50% { opacity: 1; box-shadow: 0 0 50px var(--brand-glow); } }

        /* Sequential Pillar Build */
        @keyframes slamRow4 { 0%, 5% { transform: translate3d(0, -400px, 0) rotateX(90deg); opacity: 0; } 10%, 90% { transform: translate3d(0, 0, 0) rotateX(0deg); opacity: 1; } 95%, 100% { transform: translate3d(0, 400px, 0) rotateX(-90deg); opacity: 0; } }
        @keyframes slamRow3 { 0%, 10% { transform: translate3d(0, -400px, 0) rotateX(90deg); opacity: 0; } 15%, 90% { transform: translate3d(0, 0, 0) rotateX(0deg); opacity: 1; } 95%, 100% { transform: translate3d(0, 400px, 0) rotateX(-90deg); opacity: 0; } }
        @keyframes slamRow2 { 0%, 15% { transform: translate3d(0, -400px, 0) rotateX(90deg); opacity: 0; } 20%, 90% { transform: translate3d(0, 0, 0) rotateX(0deg); opacity: 1; } 95%, 100% { transform: translate3d(0, 400px, 0) rotateX(-90deg); opacity: 0; } }
        @keyframes slamRow1 { 0%, 20% { transform: translate3d(0, -400px, 0) rotateX(90deg); opacity: 0; } 25%, 90% { transform: translate3d(0, 0, 0) rotateX(0deg); opacity: 1; } 95%, 100% { transform: translate3d(0, 400px, 0) rotateX(-90deg); opacity: 0; } }

        /* Multi-Axis Crossbeam Fragments */
        @keyframes slamFX { 0%, 25% { transform: translate3d(-400px, 0, 0) rotateY(90deg); opacity: 0; } 30%, 90% { transform: translate3d(0, 0, 0) rotateY(0deg); opacity: 1; } 95%, 100% { transform: translate3d(-400px, 0, 0) rotateY(-90deg); opacity: 0; } }
        @keyframes slamFY { 0%, 25% { transform: translate3d(0, -400px, 0) rotateX(90deg); opacity: 0; } 30%, 90% { transform: translate3d(0, 0, 0) rotateX(0deg); opacity: 1; } 95%, 100% { transform: translate3d(0, -400px, 0) rotateX(-90deg); opacity: 0; } }
        @keyframes slamFZ { 0%, 25% { transform: translate3d(0, 0, -400px) rotateZ(90deg); opacity: 0; } 30%, 90% { transform: translate3d(0, 0, 0) rotateZ(0deg); opacity: 1; } 95%, 100% { transform: translate3d(0, 0, -400px) rotateZ(-90deg); opacity: 0; } }
        @keyframes slamFNX { 0%, 25% { transform: translate3d(400px, 0, 0) rotateY(-90deg); opacity: 0; } 30%, 90% { transform: translate3d(0, 0, 0) rotateY(0deg); opacity: 1; } 95%, 100% { transform: translate3d(400px, 0, 0) rotateY(90deg); opacity: 0; } }
    </style>
</head>
<body>
    <div class="scene-tilt">
        <div class="matrix-world">
            <div class="h-core">
                <!-- Anchor Plate -->
                <div class="h-text">HUMPHREY DYNAMICS</div>

                <!-- Left Pillar -->
                <div class="cube l-block4"></div>
                <div class="cube l-block3"></div>
                <div class="cube l-block2"></div>
                <div class="cube l-block1"></div>
                
                <!-- Right Pillar -->
                <div class="cube r-block4"></div>
                <div class="cube r-block3"></div>
                <div class="cube r-block2"></div>
                <div class="cube r-block1"></div>
                
                <!-- Crossbeam Fragments -->
                <div class="cube f1"></div>
                <div class="cube f2"></div>
                <div class="cube f3"></div>
                <div class="cube f4"></div>
            </div>
        </div>
    </div>
    
    <!-- INJECTED JAVASCRIPT: Architect 3D faces for every cube dynamically -->
    <script>
        document.querySelectorAll('.cube').forEach(cube => {
            ['front', 'back', 'right', 'left', 'top', 'bottom'].forEach(faceClass => {
                let face = document.createElement('div');
                face.className = 'face ' + faceClass;
                cube.appendChild(face);
            });
        });
    </script>
</body>
</html>
