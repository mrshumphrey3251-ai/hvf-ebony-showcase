<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Kinetic Engine</title>
    <style>
        body { background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .sculpture-container { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; }
        
        /* The Rotating H Engine */
        .kinetic-h { position: relative; width: 120px; height: 160px; animation: spin 6s linear infinite; display: flex; justify-content: space-between; align-items: center; }
        .pillar { width: 32px; height: 160px; background: #00ffcc; border-radius: 4px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.6); }
        .crossbeam { position: absolute; width: 56px; height: 32px; background: #00ffcc; left: 32px; border-radius: 4px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.6); }
        
        /* The Absorption Particles */
        .particle { position: absolute; width: 12px; height: 12px; background: #ffffff; border-radius: 2px; box-shadow: 0 0 10px #ffffff; opacity: 0; }
        
        /* Trajectories simulating drawing fragments into the center crossbeam */
        .p1 { animation: absorb1 3s ease-in infinite; }
        .p2 { animation: absorb2 3s ease-in infinite 0.75s; }
        .p3 { animation: absorb3 3s ease-in infinite 1.5s; }
        .p4 { animation: absorb4 3s ease-in infinite 2.25s; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes absorb1 { 0% { transform: translate(-150px, -150px) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(0px, 0px) rotate(360deg); opacity: 0; } }
        @keyframes absorb2 { 0% { transform: translate(150px, -150px) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(0px, 0px) rotate(-360deg); opacity: 0; } }
        @keyframes absorb3 { 0% { transform: translate(150px, 150px) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(0px, 0px) rotate(360deg); opacity: 0; } }
        @keyframes absorb4 { 0% { transform: translate(-150px, 150px) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(0px, 0px) rotate(-360deg); opacity: 0; } }
    </style>
</head>
<body>
    <div class="sculpture-container">
        <div class="kinetic-h">
            <div class="pillar"></div>
            <div class="crossbeam"></div>
            <div class="pillar"></div>
        </div>
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
    </div>
</body>
</html>
